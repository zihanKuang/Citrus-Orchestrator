# ClusterIP for in-cluster MCP. Local: kubectl port-forward -n citrus svc/mcp-server 8080:8080
apiVersion: v1
kind: Service
metadata:
  name: mcp-server
  namespace: citrus
  labels:
    app: mcp-server
spec:
  type: ClusterIP
  selector:
    app: mcp-server
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP

# In-cluster MCP over Streamable HTTP.
# Apply: rbac -> secret -> service -> networkpolicy -> this file
# Agent: --mcp-url http://127.0.0.1:8080/mcp (after port-forward)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: citrus
  labels:
    app: mcp-server
    component: ai-agent
    version: v4
spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: mcp-server

  template:
    metadata:
      labels:
        app: mcp-server
        component: ai-agent
        version: v4
      annotations:
        prometheus.io/scrape: "false"

    spec:
      serviceAccountName: mcp-server-sa
      automountServiceAccountToken: true

      containers:
        - name: mcp-server
          image: mcp-server:v3
          imagePullPolicy: IfNotPresent

          command: ["python3", "-m", "mcp_server.server"]
          args:
            - "--transport"
            - "streamable-http"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: MCP_TRANSPORT
              value: "streamable-http"
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PROMETHEUS_URL
              value: "http://monitoring-kube-prometheus-prometheus:9090"
            - name: MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcp-server-auth
                  key: token

          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      restartPolicy: Always
      dnsPolicy: ClusterFirst

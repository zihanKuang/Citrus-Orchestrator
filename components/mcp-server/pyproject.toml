[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citrus-mcp-server"
version = "0.1.0"
description = "MCP server exposing Kubernetes/Prometheus diagnostic tools over stdio or Streamable HTTP."
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0",
    "kubernetes>=28.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools]
packages = ["mcp_server", "mcp_server.tools"]
